[project]
name = "biostatistics"
version = "0.1.0"
readme = "README.md"
requires-python = "~=3.13.0"

# gwaslab 4.2.2 caps numpy<2, matplotlib<3.9, and pins pysam==0.22.1.  Those exact
# versions have no cp313 wheels on PyPI, so on Python 3.13 they would each build from
# sdist (and pysam 0.22.1's sdist fails to build under Cython 3).  Override the caps to
# versions that ship cp313 wheels.  matplotlib: gwaslab's get_cmap calls are guarded (the
# one unguarded path, viz_plot_arc, is not exercised by this repo).
#
# numpy is capped <2.4: gwaslab's vendored LDSC rg estimator calls float() on size-1
# arrays of ndim>0 (extension/ldsc/ldsc_regressions.py, RG.__init__).  numpy 1.25
# deprecated that conversion and 2.4.0 turned it into a hard TypeError, which crashes the
# CT-LDSC genetic-correlation path (system_test_genetic_corr_by_ct_ldsc).  On 2.1-2.3 it
# still works (only a DeprecationWarning; we don't run warnings-as-errors).  Lift this
# ceiling once gwaslab extracts the scalar with .item() upstream.  The renovate.json
# packageRule for numpy enforces the same cap.
[tool.pixi.pypi-options.dependency-overrides]
numpy = ">=2.1,<2.4"
matplotlib = ">=3.9.2"
pysam = ">=0.24,<0.25"

[tool.pixi.workspace]
channels = [
    "conda-forge",
    "bioconda",
]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
biostatistics = { path = ".", editable = true }
# setuptools 82 removed pkg_resources, which zepid (and testmon) still import at
# import time.  synapseclient >=4.13 requires setuptools>=80.10.1, which pushes
# resolution off conda-forge's 80.9.0 and onto PyPI, so pin the upper bound here.
setuptools = ">=80.10.1,<82"

[tool.pixi.tasks]
install-parquet-cli = { cmd = "bash -lc 'cargo install parquet@57.0.0 --features=cli --locked --root ${CONDA_PREFIX}'" }
parquet-fromcsv = { cmd = "parquet-fromcsv" }
install-mr = """
mkdir -p r-libs && \
Rscript -e "if (!requireNamespace('TwoSampleMR', quietly = TRUE)) install.packages('TwoSampleMR', repos=c('https://mrcieu.r-universe.dev', 'https://cloud.r-project.org'))"
"""
install-raps= """
mkdir -p r-libs && \
Rscript -e "if (!requireNamespace('mr.raps', quietly = TRUE)) install.packages('mr.raps', repos=c('https://mrcieu.r-universe.dev', 'https://cloud.r-project.org'))"
"""
install-lava = """
mkdir -p r-libs && \
Rscript -e "if (!require('remotes', quietly=TRUE)) install.packages('remotes', repos='https://cloud.r-project.org'); if (!requireNamespace('LAVA', quietly=TRUE)) remotes::install_github('josefin-werme/LAVA')"
"""
[tool.setuptools]
packages = ["mecfs_bio", "vendored"]

[tool.pixi.activation]
env = { R_LIBS_USER = "r-libs", NO_MKDOCS_2_WARNING="1" }

[tool.pixi.feature.analysis.dependencies]
pysam = ">=0.24,<0.25" #pysam is used by gwaslab
pixi-pycharm = ">=0.0.12,<0.0.13"
pyarrow = ">=25,<26"
rust = ">=1.98,<1.99"
duckdb = ">=1.4.1,<2"
